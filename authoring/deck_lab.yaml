- id: kerberos-user-enum-for-asrep
  name: Kerberos candidate account enumeration for AS-REP roasting
  phase: cred
  tier: floor
  autonomy: semi
  when:
  - service: kerberos
  - port: 88
  tool: kerbrute
  invocation: kerbrute userenum --dc {{host}} -d {{domain}} {{wordlist}}
  parallel_safe: true
  blast_radius: low
  operator: ''
  confirms:
  - account
  verify:
    success_if: exit_code == 0 && stdout contains '+ VALID USERNAME:'
    emits:
    - account
  cost_hint: moderate
  notes: Use an approved candidate list and account for Kerberos audit events.
  _family: ad-asrep
- id: ldap-asrep-anon-discovery
  name: Anonymous LDAP discovery of preauthentication-disabled accounts
  phase: cred
  tier: floor
  autonomy: semi
  when:
  - service: ldap
  - port: 389
  tool: ldapsearch
  invocation: ldapsearch -LLL -x -H ldap://{{host}}:{{port}} -b "{{base_dn}}" "(&(objectCategory=person)(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=4194304))"
    sAMAccountName userPrincipalName
  parallel_safe: true
  blast_radius: none
  operator: ''
  confirms:
  - account
  - asreproastable
  verify:
    success_if: exit_code == 0 && stdout contains 'sAMAccountName:'
    emits:
    - account
    - asreproastable
  cost_hint: cheap
  notes: Anonymous directory binds are commonly disabled and should be attempted only
    within scope.
  _family: ad-asrep
- id: ldap-asrep-auth-discovery
  name: Authenticated LDAP discovery of preauthentication-disabled accounts
  phase: cred
  tier: standard
  autonomy: semi
