  - service: ldap
  - port: 389
  tool: ldapsearch
  invocation: ldapsearch -LLL -x -H ldap://{{host}}:{{port}} -D "{{user}}" -w "{{password}}"
    -b "{{base_dn}}" "(&(objectCategory=person)(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=4194304))"
    sAMAccountName userPrincipalName
  parallel_safe: true
  blast_radius: none
  operator: ''
  confirms:
  - account
  - asreproastable
  verify:
    success_if: exit_code == 0 && stdout contains 'sAMAccountName:'
    emits:
    - account
    - asreproastable
  cost_hint: cheap
  notes: Use a minimally privileged approved bind identity and avoid writing directory
    attributes.
  _family: ad-asrep
