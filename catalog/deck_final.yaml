  tier: standard
  autonomy: semi
  when:
  - service: ftp
  - port: 21
  tool: medusa
  invocation: medusa -h {{host}} -n {{port}} -M ftp -U {{userlist}} -P {{wordlist}} -f
  parallel_safe: false
  blast_radius: low
  operator: ''
  confirms:
  - have_cred
  - session
  - cred_grants
  verify:
    success_if: exit_code == 0 && stdout contains 'ACCOUNT FOUND' && stdout contains 'Password:' && stdout contains '[SUCCESS]'
    emits:
    - controls_principal
  cost_hint: moderate
  notes: Alternative credential engine to reduce dependency on one brute pattern.
- id: ftp-21-cred-reuse-across-services
  name: Test FTP-harvested credentials against another role
  phase: lateral
  tier: standard
  autonomy: manual
  when:
  - service: ftp
  - port: 21
  tool: crackmapexec
  invocation: crackmapexec {{target_service}} {{target_host}} -u {{user}} -p {{password}} --no-bruteforce
  parallel_safe: false
  blast_radius: low
  operator: cred-reuse-login
  confirms:
  - have_cred
  - cred_reused_on
  - session
  verify:
    success_if: target service accepts same {{user}}:{{password}} and returns authenticated session state
    emits:
    - have_cred
    - cred_reused_on
    - session
    - cred_grants
  cost_hint: moderate
  notes: Scope target services tightly; stop on first cross-service success.
- id: ftp-21-public-exploit-deploy
  name: Run public exploit when version lead is confirmed
  phase: exploit
  tier: heavy
  autonomy: semi
  when:
  - service: ftp
  - port: 21
  tool: exploit-framework
  invocation: exploit-framework --service ftp --cve {{cve}} --host {{host}} --port {{port}} --command id
  parallel_safe: false
  blast_radius: high
  operator: run-public-exploit
  confirms:
  - known_exploit
  - vuln_present
  - rce_as
  verify:
    success_if: exit_code == 0 && stdout matches 'uid=\d+\('
    emits:
    - rce_as
  cost_hint: slow
  notes: 'Two-channel proof required: command output plus persistent callback/session evidence.'
