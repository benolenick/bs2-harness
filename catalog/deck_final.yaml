- id: ftp-version-fingerprint
  name: Fingerprint FTP service version
  phase: recon
  tier: standard
  autonomy: full
  when:
  - service: ftp
  - port: 21
  tool: nmap
  invocation: nmap -p {{port}} --version-all --script banner {{host}}
  parallel_safe: true
  blast_radius: none
  operator: ''
  confirms:
  - tool
  verify:
    success_if: exit_code == 0 && (stdout contains 'ftp' || stdout contains 'FTP')
    emits:
    - tool
  cost_hint: moderate
  notes: Use fingerprinting only to scope follow-on cards.
- id: ftp-anon-root-list
  name: Enumerate root listing
  phase: enum
  tier: standard
  autonomy: semi
  when:
  - service: ftp
  - port: 21
  tool: lftp
  invocation: lftp -u {{user}},{{password}} ftp://{{host}}:{{port}} -e "ls -la; quit"
  parallel_safe: true
  blast_radius: none
  operator: ''
  confirms:
  - session
  verify:
    success_if: exit_code == 0 && (stdout contains '200' || stdout contains '226')
    emits:
    - session
    - tool
  cost_hint: cheap
  notes: Avoid repeated broad listings from too many paths.
- id: ftp-file-loot-candidate
  name: Download candidate file from writable area
  phase: loot
  tier: standard
  autonomy: manual
  when:
  - service: ftp
  - port: 21
  tool: wget
  invocation: wget --user={{user}} --password={{password}} --no-passive-ftp ftp://{{host}}:{{port}}{{target_file}} -O {{local_file}}
  parallel_safe: false
  blast_radius: none
  operator: ''
  confirms:
  - read_file
  verify:
    success_if: exit_code == 0 && file_exists {{local_file}}
    emits:
    - read_file
  cost_hint: moderate
  notes: Only pull likely-config or low-impact files.
- id: ftp-bruteforce-hydra
  name: Credential brute force with user and pass lists
  phase: cred
  tier: heavy
  autonomy: semi
  when:
  - service: ftp
  - port: 21
  tool: hydra
  invocation: hydra -L {{userlist}} -P {{wordlist}} -s {{port}} ftp://{{host}} -o {{out_file}}
  parallel_safe: false
  blast_radius: low
  operator: ''
  confirms:
  - have_cred
  verify:
    success_if: exit_code == 0 && stdout contains '[ftp]' && stdout contains 'login:' && stdout contains 'password:'
    emits:
    - controls_principal
  cost_hint: slow
  notes: Throttle and monitor lockout policy before expanding wordlists.
- id: ftp-bruteforce-ncrack
  name: Credential brute force via ncrack
  phase: cred
  tier: heavy
  autonomy: semi
  when:
  - service: ftp
  - port: 21
  tool: ncrack
  invocation: ncrack -p {{port}} --user {{userlist}} --pass {{wordlist}} ftp://{{host}} -oN {{out_file}}
  parallel_safe: false
  blast_radius: low
  operator: ''
  confirms:
  - have_cred
  verify:
    success_if: 'exit_code == 0 && stdout contains ''Discovered credentials'' && stdout matches ''[0-9]+/tcp ftp: .+ .+'''
    emits:
    - controls_principal
  cost_hint: slow
  notes: Rate-limit attempts to avoid account lockout and IDS spikes.
- id: ftp-21-anonymous-auth-probe
  name: Probe anonymous or unauthenticated-login behavior
  phase: enum
  tier: standard
  autonomy: semi
  when:
  - service: ftp
  - port: 21
  tool: curl
  invocation: curl -s --user '{{user}}:{{password}}' ftp://{{host}}:{{port}}/
  parallel_safe: true
  blast_radius: low
  operator: ''
  confirms:
  - session
  - account
  verify:
    success_if: response contains ftp reply 230 with a readable directory listing or explicit no-privilege denial after login
    emits:
    - session
    - account
    - cred_grants
  cost_hint: cheap
  notes: Use placeholder creds only and stop on any unexpected data access.
- id: ftp-21-medusa-dict-bruteforce
  name: Medusa user+pass dictionary brute-force
